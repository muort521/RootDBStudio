name: Release APK

# 只能手动发布：Actions → Release APK → Run workflow → 输入版本号，例如 v2.0.2
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（带 v，必须与 CHANGELOG 的标题一致，例如 v2.0.2）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if ! [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式必须是 vX.Y.Z，例如 v2.0.2（收到：$V）"
            exit 1
          fi
          NO="${V#v}"
          MAJOR="${NO%%.*}"; REST="${NO#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          echo "VERSION_NO=$NO" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"
          echo "APK_NAME=RootDBStudio-${NO}-release.apk" >> "$GITHUB_ENV"
          echo "版本 $V → versionName=$NO, versionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # 新版 SDK 里 Android 17 的包名带主次版本号（platforms;android-37.0 / 37.1 / 37.2），
          # 没有不带版本的 platforms;android-37，所以这里逐个尝试并校验安装结果。
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ]; then
            echo "::error::找不到 sdkmanager（ANDROID_SDK_ROOT=$SDK）"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          for PKG in "platforms;android-37.0" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"; do
            echo "安装 $PKG"
            "$SDKMANAGER" --sdk_root="$SDK" --channel=3 "$PKG" || echo "::warning::安装 $PKG 失败，继续尝试其它包"
          done
          ls "$SDK/platforms" | grep -E '^android-37(\.[0-9]+)?$' || {
            echo "::error::没有安装成功 Android 37 平台，可用包列表如下："
            "$SDKMANAGER" --sdk_root="$SDK" --channel=3 --list | grep -E "platforms/android-37"
            exit 1
          }
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少仓库 Secret KEYSTORE_BASE64（release keystore 的 base64）"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/rootdb-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/rootdb-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "签名配置已写入 keystore.properties"

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NO" \
            -PversionCode="$VERSION_CODE" \
            --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Verify APK version & signature
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          BADGING="$("$AAPT2" dump badging "$APK_NAME")"
          echo "$BADGING" | grep -E "package:|versionCode|versionName"
          echo "$BADGING" | grep -q "versionName='$VERSION_NO'" || {
            echo "::error::APK 的 versionName 与输入 $VERSION_NO 不一致"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs "$APK_NAME" | head -n 5

      - name: Prepare release notes
        run: |
          set -euo pipefail
          awk -v ver="$VERSION_NO" '
            $0 ~ "^## " ver { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            printf 'RootDB Studio %s\n\n详见 CHANGELOG.md。\n' "$VERSION_NO" > notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          TMP="${V}-draft-${GITHUB_RUN_ID}"

          # 清理同版本残留的 Release / tag，避免沿用旧时间戳
          if gh release view "$V" >/dev/null 2>&1; then
            echo "删除已存在的 Release $V"
            gh release delete "$V" --yes --cleanup-tag || gh release delete "$V" --yes
          fi
          if git ls-remote --tags origin "refs/tags/$V" | grep -q .; then
            echo "删除残留 tag $V"
            git push origin ":refs/tags/$V" || true
          fi

          # 关键：草稿先用临时 tag，APK 上传完后再在“发布”这一步改回正式 tag。
          # GitHub 是在发布时才创建 vX.Y.Z 这个 tag、并据此生成源码包，
          # 所以 Source code (zip/tar.gz) 的时间不会早于 APK。
          gh release create "$TMP" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "RootDB Studio $V" \
            --notes-file notes.md
          gh release upload "$TMP" "$APK_NAME" --clobber
          ASSETS="$(gh release view "$TMP" --json assets -q '.assets[].name')"
          echo "草稿附件：$ASSETS"
          echo "$ASSETS" | grep -qx "$APK_NAME" || { echo "::error::APK 未上传成功"; exit 1; }

          gh release edit "$TMP" --tag "$V" --target "$GITHUB_SHA" --draft=false

          # 删掉临时 tag（Release 已改用正式 tag，不受影响）
          git push origin ":refs/tags/$TMP" 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TMP}" >/dev/null 2>&1 || true

          gh release view "$V" --json tagName,url,assets \
            -q '"\(.tagName) → \(.url)\n附件：\(.assets[].name)"'
