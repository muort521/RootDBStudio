name: Release APK

# 只能手动发布：Actions → Release APK → Run workflow → 输入版本号，例如 v2.0.2
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（带 v，必须与 CHANGELOG 的标题一致，例如 v2.0.2）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if ! [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式必须是 vX.Y.Z，例如 v2.0.2（收到：$V）"
            exit 1
          fi
          NO="${V#v}"
          MAJOR="${NO%%.*}"; REST="${NO#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          echo "VERSION_NO=$NO" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"
          echo "APK_NAME=RootDBStudio-${NO}-release.apk" >> "$GITHUB_ENV"
          echo "ZIP_NAME=RootDBStudio-${NO}-source.zip" >> "$GITHUB_ENV"
          echo "版本 $V → versionName=$NO, versionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少仓库 Secret KEYSTORE_BASE64（release keystore 的 base64）"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/rootdb-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/rootdb-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "签名配置已写入 keystore.properties"

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NO" \
            -PversionCode="$VERSION_CODE" \
            --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Verify APK version & signature
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          BADGING="$("$AAPT2" dump badging "$APK_NAME")"
          echo "$BADGING" | grep -E "package:|versionCode|versionName"
          echo "$BADGING" | grep -q "versionName='$VERSION_NO'" || {
            echo "::error::APK 的 versionName 与输入 $VERSION_NO 不一致"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs "$APK_NAME" | head -n 5

      - name: Build source archive
        run: |
          set -euo pipefail
          # 用当前提交快照，排除 keystore / local.properties（它们本就不在版本库中）
          git archive --format=zip --prefix=RootDBStudio/ -o "$ZIP_NAME" HEAD
          unzip -l "$ZIP_NAME" | grep -E "README.md|LICENSE|CHANGELOG.md|settings.gradle.kts|app/build.gradle.kts" > /dev/null
          echo "源码包内容校验通过：$ZIP_NAME"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          awk -v ver="$VERSION_NO" '
            $0 ~ "^## " ver { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            printf 'RootDB Studio %s\n\nAPK 与源码包同时发布；详见 CHANGELOG.md。\n' "$VERSION_NO" > notes.md
          fi
          {
            echo ""
            echo "**Assets / 附件**"
            echo "- \`$APK_NAME\` — Android 8.0+ (API 26+), targetSdk 37"
            echo "- \`$ZIP_NAME\` — full source snapshot (Gradle wrapper included)"
            echo ""
            echo "签名与之前版本一致，可直接覆盖安装。"
          } >> notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.version }}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "RootDB Studio ${{ inputs.version }}" \
            --notes-file notes.md

      - name: Upload APK and source together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.version }}" "$APK_NAME" "$ZIP_NAME" --clobber
          # 两个附件都在草稿里才允许发布，保证源码不会早于 APK 出现在页面上
          ASSETS="$(gh release view "${{ inputs.version }}" --json assets -q '.assets[].name')"
          echo "$ASSETS"
          echo "$ASSETS" | grep -qx "$APK_NAME"
          echo "$ASSETS" | grep -qx "$ZIP_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ inputs.version }}" --draft=false
          gh release view "${{ inputs.version }}" --json tagName,url,assets \
            -q '"\(.tagName) → \(.url)\n附件：\(.assets[].name)"'
